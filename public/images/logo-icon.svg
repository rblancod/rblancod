<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LUCULUC">
  <defs>
    <radialGradient id="bgi" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#15512f"/>
      <stop offset="60%" stop-color="#0d3a22"/>
      <stop offset="100%" stop-color="#06160e"/>
    </radialGradient>
    <linearGradient id="goldi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6cf9a"/>
      <stop offset="100%" stop-color="#bd9a5b"/>

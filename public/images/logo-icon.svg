  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#bgi)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldi)" stroke-width="1.6" opacity="0.9"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#f5f3ec" stroke-width="0.8" opacity="0.28"/>

  <!-- volcano -->
  <g stroke="#f5f3ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M48 138 L88 76 Q97 62 106 62 Q115 62 124 76 L160 138" opacity="0.96"/>
    <path d="M92 72 L106 62 L120 72" opacity="0.96"/>
  </g>

  <!-- steam / key -->
  <path d="M106 58 C106 46 97 44 97 35 C97 27 106 26 106 18" stroke="url(#goldi)" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <circle cx="106" cy="13" r="6" fill="url(#goldi)"/>

  <!-- branch -->
  <path d="M40 142 Q100 160 164 142" stroke="#f5f3ec" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.72"/>

  <!-- leaf sprig + frog -->
